name: Check framework coverage changes
on:
  pull_request:
    paths:
      - ".github/workflows/csv-coverage-pr-artifacts.yml"
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p comparison pr
          printf '%s\n' '**attacker-controlled bot comment**' > comparison/comparison.md
          printf '1\n' > pr/NR
      - uses: actions/upload-artifact@v4
        with: { name: comparison, path: comparison/ }
      - uses: actions/upload-artifact@v4
        with: { name: pr, path: pr/ }
